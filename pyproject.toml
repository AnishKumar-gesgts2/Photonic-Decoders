[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fusion-hypergraph-benchmark"
version = "0.1.0"
description = "Full-scale synthetic evaluation harness for a fusion-photonic hypergraph decoder"
requires-python = ">=3.11"
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pymatching>=2.2"
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
fusion-hypergraph = "fusion_hypergraph.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

